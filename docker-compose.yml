services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: barbershop_backend
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - barbershop_net

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: barbershop_bot
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - barbershop_net

networks:
  barbershop_net:
    driver: bridge
